id: io.github.garglk.Gargoyle
runtime: org.kde.Platform
runtime_version: "6.10"
sdk: org.kde.Sdk
command: gargoyle
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --system-talk-name=org.freedesktop.UDisks2
modules:
  - name: libopenmpt
    config-opts:
      - --disable-examples
      - --disable-openmpt123
      - --disable-static
      - --disable-tests
      - --without-mpg123
      - --without-ogg
      - --without-vorbis
      - --without-vorbisfile
      - --without-portaudio
      - --without-portaudiocpp
      - --without-sndfile
      - --without-flac
    cleanup:
      - /include
      - /lib/*.la
      - /lib/*.so
      - /lib/pkgconfig
      - /share/doc
    sources:
      - type: archive
        url: https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-0.8.4+release.autotools.tar.gz
        sha256: 627f9bf11aacae615a1f2c982c7e88cb21f11b2d6f0267946f7c82c5eae4943b

  - name: gargoyle
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DQT_VERSION=6
      - -DWITH_KDE=ON
      - -DSOUND=QT
      - -DCMAKE_INSTALL_LIBDIR=lib
    post-install:
      - install -D ../gargoyle-house.svg /app/share/icons/hicolor/scalable/apps/io.github.garglk.Gargoyle.svg
    sources:
      - type: archive
        url: https://github.com/garglk/garglk/releases/download/2026.1/gargoyle-2026.1.tar.gz
        sha256: 975035dd2dc6aa7daa01962c9c19d4468f0632c9d8c43b14e55c754548796208
      - type: file
        path: gargoyle-house.svg
